name: Build OmniBaby APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          while IFS='=' read -r key value; do
            [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
            key=$(echo "$key" | tr -d '[:space:]')
            value=$(echo "$value" | tr -d '[:space:]')
            export "$key=$value"
          done < version.properties
          echo "major=$VERSION_MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$VERSION_MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$VERSION_PATCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_MAJOR.$VERSION_MINOR.$VERSION_PATCH" >> "$GITHUB_OUTPUT"

      - name: Generate src/version.js
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          printf '// Auto-généré par le CI\nexport const APP_VERSION = "%s";\n' "$VERSION" > src/version.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Static check (variables, imports, hooks)
        run: npm run check

      - name: Build React app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6

      - name: Capacitor init
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init OmniBaby com.omnibaby.app --web-dir=dist --npm-client=npm
          else
            echo "capacitor.config.json already present, skipping init."
          fi

      - name: Capacitor add android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already present, skipping add."
          fi

      - name: Capacitor sync
        run: npx cap sync android

      # ----------------------------------------------------------------
      # Ressources Android propres à l'appli (icône de notification…)
      # android-res/ est recopié dans android/app/src/main/res/
      # ----------------------------------------------------------------
      - name: Copy Android resources
        run: |
          if [ -d "android-res" ]; then
            cp -r android-res/. android/app/src/main/res/
            echo "✓ Ressources copiées :"; find android-res -type f
          else
            echo "⚠ android-res absent — icône de notification par défaut"
          fi

      # ----------------------------------------------------------------
      # Copier google-services.json requis par Firebase Android SDK
      # ----------------------------------------------------------------
      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "✓ google-services.json copié"
          else
            echo "⚠ google-services.json absent — Firebase Android désactivé"
          fi

      # ----------------------------------------------------------------
      # Ajout permission biométrie dans AndroidManifest.xml
      # Requis par @capgo/capacitor-native-biometric pour que
      # isAvailable() retourne true sur Android
      # ----------------------------------------------------------------
      - name: Add biometric permission to AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "USE_BIOMETRIC" "$MANIFEST"; then
            echo "Biometric permission already present."
          else
            sed -i 's|<manifest|<manifest|' "$MANIFEST"
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />' "$MANIFEST"
            echo "✓ Biometric permissions added to AndroidManifest.xml"
          fi

      # ----------------------------------------------------------------
      # Génération des icônes
      # ----------------------------------------------------------------
      - name: Generate Android icons
        run: |
          npm install -g @capacitor/assets@latest
          if [ -f "public/icon.png" ] && [ ! -f "assets/icon.png" ]; then
            mkdir -p assets
            cp public/icon.png assets/icon.png
          fi
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android
            echo "✓ Android icons generated"
          else
            echo "⚠ No icon source found, skipping."
          fi

      - name: Fix Maven repositories
        run: |
          python3 - << 'PYEOF'
          import re
          with open("android/build.gradle", "r") as f:
              content = f.read()
          mirror = '\n        maven { url "https://repo1.maven.org/maven2" }\n        maven { url "https://dl.google.com/dl/android/maven2" }'
          content = re.sub(r'(google\(\))', r'\1' + mirror, content, count=1)
          with open("android/build.gradle", "w") as f:
              f.write(content)
          print("Maven mirrors added.")
          PYEOF

      - name: Set version in build.gradle
        run: |
          python3 - << 'PYEOF'
          import re, os
          major = int(os.environ.get("MAJOR", "2"))
          minor = int(os.environ.get("MINOR", "1"))
          patch = int(os.environ.get("PATCH", "0"))
          version = f"{major}.{minor}.{patch}"
          version_code = major * 10000 + minor * 100 + patch
          with open("android/app/build.gradle", "r") as f:
              content = f.read()
          content = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', content)
          content = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version}"', content)
          with open("android/app/build.gradle", "w") as f:
              f.write(content)
          print(f"Set versionCode={version_code}, versionName={version}")
          PYEOF
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
          PATCH: ${{ steps.version.outputs.patch }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/omnibaby.keystore
          echo "Keystore size: $(wc -c < android/app/omnibaby.keystore) bytes"

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties << KEOF
          storeFile=omnibaby.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          KEOF
          sed -i 's/^[[:space:]]*//' android/keystore.properties

      - name: Configure signing in app/build.gradle
        run: |
          python3 - << 'PYEOF'
          with open("android/app/build.gradle", "r") as f:
              content = f.read()
          if "keystoreProperties" in content:
              print("Signing already configured, skipping.")
          else:
              header = '''def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
              signing_config = '''    signingConfigs {
              release {
                  storeFile file(keystoreProperties["storeFile"])
                  storePassword keystoreProperties["storePassword"]
                  keyAlias keystoreProperties["keyAlias"]
                  keyPassword keystoreProperties["keyPassword"]
              }
          }

          '''
              content = header + content
              content = content.replace("    buildTypes {", signing_config + "    buildTypes {", 1)
              content = content.replace("        release {", "        release {\n            signingConfig signingConfigs.release", 1)
              with open("android/app/build.gradle", "w") as f:
                  f.write(content)
              print("Signing configuration added.")
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_SRC" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          cp "$APK_SRC" "OmniBaby-v${VERSION}.apk"
          echo "APK_PATH=OmniBaby-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "✓ APK: OmniBaby-v${VERSION}.apk ($(wc -c < "OmniBaby-v${VERSION}.apk") bytes)"

      - name: Create web ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          zip -r "OmniBaby-web-v${VERSION}.zip" dist/
          echo "ZIP_PATH=OmniBaby-web-v${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Create Git tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping."
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniBaby-v${{ steps.version.outputs.version }}
          path: |
            ${{ env.APK_PATH }}
            ${{ env.ZIP_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OmniBaby v${{ steps.version.outputs.version }}
          body: |
            ## OmniBaby v${{ steps.version.outputs.version }}
            Application Android de suivi bébé — hors-ligne, multi-enfants, synchronisation entre parents.
            ### Installation
            1. Télécharger `OmniBaby-v${{ steps.version.outputs.version }}.apk`
            2. Ouvrir sur Android → autoriser sources inconnues → installer
            ### Fichiers
            - `OmniBaby-v${{ steps.version.outputs.version }}.apk` — APK Android signé
            - `OmniBaby-web-v${{ steps.version.outputs.version }}.zip` — Sources web compilées
          files: |
            ${{ env.APK_PATH }}
            ${{ env.ZIP_PATH }}
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
